name: npm dependency security report

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/npm-security-report.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/npm-security-report.yml'
  schedule:
    - cron: '11 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Production dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Audit locked production dependencies
        shell: bash
        run: |
          mkdir -p security-reports
          set +e
          npm audit --omit=dev --audit-level=high --json > security-reports/npm-audit.json
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "npm audit returned $status. Review vulnerabilities and registry errors in the report." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "npm audit completed without high-severity production vulnerability findings." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Advisory baseline: a successful workflow is not a clean security certification." >> "$GITHUB_STEP_SUMMARY"
      - name: Archive dependency report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recordly-npm-audit-${{ github.run_id }}
          path: security-reports/npm-audit.json
          retention-days: 14
          if-no-files-found: warn
